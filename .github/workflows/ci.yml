name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # The crate declares a minimum supported Rust version; a dependency bump or a
  # newly used language feature can quietly break it, because every other job
  # runs on stable.  This is the check that caught `ignore` pulling in
  # let-chains and two crates whose own sources had outgrown their declared
  # MSRV.  The toolchain is read out of Cargo.toml rather than written here:
  # six repositories in this suite pinned a version their own manifest had
  # already outgrown, and `cargo check --locked` hard-errors on that, so CI was
  # red on every push until someone noticed.  Deriving the pin makes the two
  # incapable of diverging.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the MSRV declared in Cargo.toml
        id: msrv
        run: |
          version="$(sed -n 's/^rust-version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)"
          if [ -z "$version" ]; then
            echo "Cargo.toml declares no rust-version" >&2
            exit 1
          fi
          echo "Declared MSRV: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Build on the declared minimum supported Rust
        run: cargo check --all-targets --locked

  # `make check` is the gate, here and on a developer's machine.  Listing
  # individual targets here instead lets the two drift, and it did: core-verify,
  # which fails the build when a vendored simplecore file is edited in place,
  # never ran in CI at all.  For that to be safe `check` has to be self-contained
  # on a bare checkout, so `vim-test` builds the daemon it drives rather than
  # relying on a binary an earlier step -- or an earlier decade -- left behind.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Install Vim
        run: |
          sudo apt-get update
          sudo apt-get install --yes vim-nox

      - name: make check
        run: make check

      - name: Build release artifact
        run: cargo build --release --locked

      - name: Validate installer syntax
        run: bash -n install.sh
